services:
  btc-electrum:
    build:
      context: ./docker/btc-electrum
      args:
        VERSION: "4.6.2"
        CHECKSUM_SHA512: "890c1fae4cd2da5f1fea3f07c1c6b537f9557177b86e23c40333ec83743ed46182ec74e43a27416a3eaa9704d87d0a1702d0a789b23467bcc68a17d638b43655"
    container_name: btc-electrum
    restart: unless-stopped
    volumes:
      - bitcoin-data:/home/electrum/.electrum
    environment:
      - TESTNET=${TESTNET}
      - ELECTRUM_RPC_USER=user
      - ELECTRUM_RPC_PASSWORD=${ELECTRUM_RPC_PASSWORD}
      - ELECTRUM_SERVER_ADDRESS=${BITCOIN_ELECTRUM_SERVER_ADDRESS}

  ltc-electrum:
    build:
      context: ./docker/ltc-electrum
      args:
        VERSION: "4.6.2-3"
        CHECKSUM_SHA512: "d271154250a47bab94cb17d2eb229b6483da1016970f7a74fcf0c713a7ad3dfafe53fa6429ce0d76964f71b52151b5da43ef0c38dc7577f53a47738859b693da"
    container_name: ltc-electrum
    restart: unless-stopped
    volumes:
      # Electrum-LTC's data dir: the image's user is `electrum`, and it writes
      # .electrum-ltc. (Upstream mounted /home/electrum-ltc/.electrum, a path
      # nothing uses, so the wallets lived in the container and a recreate
      # lost them.)
      - litecoin-data:/home/electrum/.electrum-ltc
    environment:
      - TESTNET=${TESTNET}
      - ELECTRUM_RPC_USER=user
      - ELECTRUM_RPC_PASSWORD=${ELECTRUM_RPC_PASSWORD}
      - ELECTRUM_SERVER_ADDRESS=${LITECOIN_ELECTRUM_SERVER_ADDRESS}

  ltc-mweb-electrum:
    build:
      context: ./docker/ltc-electrum
      args:
        VERSION: "4.6.2-3"
        CHECKSUM_SHA512: "d271154250a47bab94cb17d2eb229b6483da1016970f7a74fcf0c713a7ad3dfafe53fa6429ce0d76964f71b52151b5da43ef0c38dc7577f53a47738859b693da"
    container_name: ltc-mweb-electrum
    restart: unless-stopped
    volumes:
      - litecoin-mweb-data:/home/electrum/.electrum-ltc
    environment:
      - TESTNET=${TESTNET}
      - ELECTRUM_RPC_USER=user
      - ELECTRUM_RPC_PASSWORD=${ELECTRUM_RPC_PASSWORD}
      - ELECTRUM_SERVER_ADDRESS=${LITECOIN_ELECTRUM_SERVER_ADDRESS}

  monero-wallet-rpc:
    build:
      context: ./docker/monero-wallet-rpc
      args:
        VERSION: "${MONERO_WALLET_RPC_VERSION:-v0.18.5.4}"
    restart: unless-stopped
    container_name: monero-wallet-rpc
    volumes:
      - monero-wallet-rpc-data:/home/monero
    command:
      - --trusted-daemon
      - --rpc-bind-port=18082
      - --rpc-login=user:${MONERO_RPC_PASSWORD}
      - --daemon-address=${MONERO_DAEMON_ADDRESS}
      - --wallet-dir=/home/monero/wallet

  # Zcash wallet (zecd, distroless: no shell). Opt-in: add zec to AUTOFORWARD_COINS
  # and restore the wallet once with:
  #   docker compose --profile zcash-init run --rm zcash-wallet-init
  zcash-wallet:
    image: ghcr.io/zecrocks/zecd:${ZECD_VERSION:-0.8.2}
    container_name: zcash-wallet
    restart: unless-stopped
    command: ["run", "--conf", "/etc/zecd/zecd.toml"]
    environment:
      - ZECD_RPC_PASSWORD=${ZCASH_RPC_PASSWORD}
    volumes:
      - zcash-wallet-data:/var/lib/zecd
      - ./docker/zcash-wallet/zecd.toml:/etc/zecd/zecd.toml:ro

  # One-shot restore from the seed; the only container that ever sees it.
  zcash-wallet-init:
    image: ghcr.io/zecrocks/zecd:${ZECD_VERSION:-0.8.2}
    profiles: ["zcash-init"]
    command: ["init", "--restore", "--birthday", "${ZCASH_BIRTH_HEIGHT}", "--conf", "/etc/zecd/zecd.toml"]
    environment:
      - ZECD_MNEMONIC=${ZCASH_WALLET_SEED}
      - ZECD_RPC_PASSWORD=${ZCASH_RPC_PASSWORD}
    volumes:
      - zcash-wallet-data:/var/lib/zecd
      - ./docker/zcash-wallet/zecd.toml:/etc/zecd/zecd.toml:ro

  seed-importer:
    build:
      context: .
    container_name: seed-importer
    environment:
      - PYTHONUNBUFFERED=1
      - TESTNET=${TESTNET}
      - AUTOFORWARD_COINS=${AUTOFORWARD_COINS:-btc,ltc,ltc-mweb,xmr}
      - DRY_RUN=${DRY_RUN:-1}
      - PEGOUT_LIVE=${PEGOUT_LIVE:-0}
      - ELECTRUM_GAP_LIMIT=${ELECTRUM_GAP_LIMIT:-1000}
      - BITCOIN_ELECTRUM_RPC_URL=http://btc-electrum:7000
      - LITECOIN_ELECTRUM_RPC_URL=http://ltc-electrum:7000
      - LITECOIN_MWEB_ELECTRUM_RPC_URL=http://ltc-mweb-electrum:7000
      - ELECTRUM_RPC_USERNAME=user
      - ELECTRUM_RPC_PASSWORD=${ELECTRUM_RPC_PASSWORD}
      - BITCOIN_WALLET_SEED=${BITCOIN_WALLET_SEED}
      - LITECOIN_WALLET_SEED=${LITECOIN_WALLET_SEED}
      - LITECOIN_MWEB_WALLET_SEED=${LITECOIN_MWEB_WALLET_SEED}
      - MONERO_RPC_URL=http://monero-wallet-rpc:18082/json_rpc
      - MONERO_RPC_USERNAME=user
      - MONERO_RPC_PASSWORD=${MONERO_RPC_PASSWORD}
      - MONERO_WALLET_SEED=${MONERO_WALLET_SEED}
      - MONERO_WALLET_PASSWORD=${MONERO_WALLET_PASSWORD}
      - MONERO_WALLET_HEIGHT=${MONERO_WALLET_HEIGHT}
      - MONERO_WALLET_FILENAME=${MONERO_WALLET_FILENAME:-mywallet}
      - MONERO_SUBADDRESS_LOOKAHEAD=${MONERO_SUBADDRESS_LOOKAHEAD:-50:20000}
    command: python ./src/seed-importer.py
    depends_on:
      - btc-electrum
      - ltc-electrum
      - monero-wallet-rpc

  autoforward:
    build:
      context: .
    container_name: autoforward
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TESTNET=${TESTNET}
      - AUTOFORWARD_COINS=${AUTOFORWARD_COINS:-btc,ltc,ltc-mweb,xmr}
      - DRY_RUN=${DRY_RUN:-1}
      - PEGOUT_LIVE=${PEGOUT_LIVE:-0}
      - ELECTRUM_GAP_LIMIT=${ELECTRUM_GAP_LIMIT:-1000}
      - BITCOIN_ELECTRUM_RPC_URL=http://btc-electrum:7000
      - LITECOIN_ELECTRUM_RPC_URL=http://ltc-electrum:7000
      - LITECOIN_MWEB_ELECTRUM_RPC_URL=http://ltc-mweb-electrum:7000
      - ELECTRUM_RPC_USERNAME=user
      - ELECTRUM_RPC_PASSWORD=${ELECTRUM_RPC_PASSWORD}
      - MONERO_RPC_URL=http://monero-wallet-rpc:18082/json_rpc
      - MONERO_RPC_USERNAME=user
      - MONERO_RPC_PASSWORD=${MONERO_RPC_PASSWORD}
      - MONERO_WALLET_PASSWORD=${MONERO_WALLET_PASSWORD}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - MONERO_WALLET_FILENAME=${MONERO_WALLET_FILENAME:-mywallet}
      - MIN_BITCOIN_SEND_AMOUNT=${MIN_BITCOIN_SEND_AMOUNT:-0.0001}
      - MIN_LITECOIN_SEND_AMOUNT=${MIN_LITECOIN_SEND_AMOUNT:-0.05}
      - MIN_MONERO_SEND_AMOUNT=${MIN_MONERO_SEND_AMOUNT:-0.03}
      - MIN_ZCASH_SEND_AMOUNT=${MIN_ZCASH_SEND_AMOUNT:-0.01}
      - ZCASH_RPC_URL=http://zcash-wallet:8232/
      - ZCASH_HEALTH_URL=http://zcash-wallet:9233
      - ZCASH_RPC_PASSWORD=${ZCASH_RPC_PASSWORD}
      - MAX_NETWORK_FEE_PERCENT=${MAX_NETWORK_FEE_PERCENT:-5}
      - BITCOIN_FEE_SOURCE=${BITCOIN_FEE_SOURCE:-https://mempool.space/api/v1/fees/recommended}
      - BITCOIN_FEE_RATE=${BITCOIN_FEE_RATE:-halfHourFee}
      - LITECOIN_FEE_SOURCE=${LITECOIN_FEE_SOURCE:-https://litecoinspace.org/api/v1/fees/recommended}
      - LITECOIN_FEE_RATE=${LITECOIN_FEE_RATE:-halfHourFee}
      - STATUS_DIR=/status
    volumes:
      - ./status:/status
    command: python ./src/autoforward.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seed-importer

  autoconvert:
    build:
      context: .
    container_name: autoconvert
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TESTNET=${TESTNET}
      - AUTOFORWARD_COINS=${AUTOFORWARD_COINS:-btc,ltc,ltc-mweb,xmr}
      - DRY_RUN=${DRY_RUN:-1}
      - PEGOUT_LIVE=${PEGOUT_LIVE:-0}
      - ELECTRUM_GAP_LIMIT=${ELECTRUM_GAP_LIMIT:-1000}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - SETTLEMENT_CURRENCY=${SETTLEMENT_CURRENCY}
      - MAX_SLIPPAGE_PERCENT=${MAX_SLIPPAGE_PERCENT:-0.5}
      - AUTOCONVERT_ASSETS=${AUTOCONVERT_ASSETS:-XBT,LTC,XMR}
      - STATUS_DIR=/status
    volumes:
      - ./status:/status
    command: python ./src/autoconvert.py
    depends_on:
      - seed-importer

volumes:
  zcash-wallet-data:
  bitcoin-data:
  litecoin-data:
  litecoin-mweb-data:
  monero-wallet-rpc-data:
